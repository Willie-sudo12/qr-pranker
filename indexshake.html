<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Security Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

#box{
  text-align:center;
  width:280px;
}

h1{
  color:#ff3b3b;
  margin-bottom:12px;
  animation: shake 0.4s infinite;
}

/* Shake animation */
@keyframes shake {
  0% { transform: translate(0); }
  25% { transform: translate(-2px, 1px); }
  50% { transform: translate(2px, -1px); }
  75% { transform: translate(-1px, -2px); }
  100% { transform: translate(1px, 2px); }
}

#scan{
  font-size:13px;
  letter-spacing:2px;
  opacity:.85;
  margin-bottom:16px;
}

/* Animated dots */
.dots::after{
  content:"";
  animation:dots 1.5s steps(3,end) infinite;
}
@keyframes dots{
  0%{content:""}
  33%{content:"."}
  66%{content:".."}
  100%{content:"..."}
}

/* Progress bar */
#bar{
  width:100%;
  height:6px;
  background:#222;
  border-radius:4px;
  overflow:hidden;
}
#fill{
  height:100%;
  width:0%;
  background:#ff3b3b;
  transition: width 8s linear;
}

p{
  margin-top:14px;
  opacity:.9;
}
</style>
</head>

<body>
<div id="box">
  <h1 id="m">You Just Got Hacked!</h1>
  <div id="scan" class="dots">Scanning device</div>
  <div id="bar"><div id="fill"></div></div>
  <p id="s"></p>
</div>

<script>
  // start progress bar
  document.getElementById("fill").style.width = "100%";

  // reveal after 8 seconds
  setTimeout(function(){
    document.getElementById("m").innerText =
      "Not really, but you could have been.";
    document.getElementById("m").style.animation = "none";
    document.getElementById("scan").innerText = "";
    document.getElementById("s").innerText =
      "Don't scan random QR codes.";
  }, 8000);
</script>
</body>
</html>
